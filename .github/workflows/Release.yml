name: Release

# 发布流程：
# 1. bun changeset
# 2. bun changeset version
# 3. 提交并 push 到 master
# 4. 本 workflow 检测三个 package.json 的版本变化，发布尚未出现在 npm 的版本
on:
  push:
    branches:
      - master
    paths:
      - "packages/calendar/package.json"
      - "packages/calendar-ui/package.json"
      - "packages/calendar-ui-lunar/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 装 vp / Node / bun，并执行 vp install
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
          registry-url: https://registry.npmjs.org
          scope: "@sanguogege"

      - name: Check, test and build
        run: vp run ready

      - name: Publish unpublished packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          packages=(
            "packages/calendar"
            "packages/calendar-ui"
            "packages/calendar-ui-lunar"
          )
          published=()

          for dir in "${packages[@]}"; do
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            existing=$(npm view "${name}@${version}" version 2>/dev/null | tail -n 1 || true)

            if [ "$existing" = "$version" ]; then
              echo "::notice title=Skip ${name}::${name}@${version} 已存在于 npm"
              continue
            fi

            echo "::notice title=Publish ${name}::发布 ${name}@${version}"
            (cd "$dir" && bun publish --access public)
            published+=("${name}@${version}")
          done

          if [ "${#published[@]}" -eq 0 ]; then
            echo "::notice::没有需要发布的版本"
          fi

          for spec in "${published[@]}"; do
            if ! git rev-parse --verify --quiet "refs/tags/${spec}" > /dev/null; then
              git tag "${spec}"
              git push origin "${spec}"
            fi

            if ! gh release view "${spec}" > /dev/null 2>&1; then
              gh release create "${spec}" --title "${spec}" --generate-notes
            fi
          done
