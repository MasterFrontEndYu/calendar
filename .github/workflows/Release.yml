name: Release

# 发布流程：
# 1. bun changeset
# 2. bun changeset version（更新三个包的版本号和 CHANGELOG）
# 3. bun install，提交并 push 到 master
# 4. 本 workflow 构建、校验后，发布 npm 上还不存在的版本。
#    每发布成功一个包就立刻打 tag、建 Release，中途失败不会丢前面包的 tag；
#    重跑本 workflow 会把漏掉的 tag / Release 补齐，已存在的 Release 不会被改写。
#
# 认证走 npm Trusted Publishing（OIDC）：不需要 NPM_TOKEN，也不需要 .npmrc。
on:
  push:
    branches:
      - master
    paths:
      - "packages/calendar/package.json"
      - "packages/calendar-ui/package.json"
      - "packages/calendar-ui-lunar/package.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-packages
  cancel-in-progress: false

env:
  # gh release 用；GITHUB_TOKEN 由 Actions 提供，配合 contents: write 即可
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整历史才能判断哪些 tag 已经推送过
          fetch-depth: 0

      # 装 vp / Node / bun，并执行 vp install
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      # Trusted Publishing 要求 npm >= 11.5.1，不依赖 runner 自带的版本
      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build
        run: vp run -r build

      - name: Check and test
        run: vp check && vp run -r test

      - name: Publish, tag and create releases
        run: |
          set -uo pipefail

          # 发布顺序：calendar 是另外两个包的基础，必须先发
          packages=(
            "packages/calendar"
            "packages/calendar-ui"
            "packages/calendar-ui-lunar"
          )

          # npm publish 不会替换 workspace: 协议，直接发出去用户装不上。
          # 打包期间把 workspace:* 改写成真实版本号，发完立刻还原，
          # 仓库里始终保留 workspace:*。
          rewrite_workspace_deps() {
            node -e '
          const fs = require("fs");
          const path = require("path");
          const file = process.argv[1];
          const versions = {};
          for (const group of ["packages", "apps"]) {
            if (!fs.existsSync(group)) continue;
            for (const entry of fs.readdirSync(group, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const manifestPath = path.join(group, entry.name, "package.json");
              if (!fs.existsSync(manifestPath)) continue;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              if (manifest.name && manifest.version) versions[manifest.name] = manifest.version;
            }
          }
          const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
          for (const [name, spec] of Object.entries(manifest.dependencies || {})) {
            if (typeof spec !== "string" || !spec.startsWith("workspace:")) continue;
            const range = spec.slice("workspace:".length);
            const version = versions[name];
            if (!version) throw new Error(name + " 不在 workspace 里，无法替换 " + spec);
            manifest.dependencies[name] =
              range === "*" ? version : range === "^" || range === "~" ? range + version : range;
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          ' "$1"
          }

          publish_package() {
            local dir="$1"
            local name="$2"
            local version="$3"
            local spec="${name}@${version}"

            local existing
            existing=$(npm view "$spec" version 2>/dev/null | tail -n 1 || true)
            if [ "$existing" = "$version" ]; then
              echo "::notice title=Skip ${name}::${spec} 已存在于 npm"
              return 0
            fi

            echo "::notice title=Publish ${name}::发布 ${spec}"
            local backup
            backup=$(mktemp)
            cp "${dir}/package.json" "$backup"
            if ! rewrite_workspace_deps "${dir}/package.json"; then
              cp "$backup" "${dir}/package.json"
              rm -f "$backup"
              return 1
            fi

            local status=0
            ( cd "$dir" && npm publish --access public --provenance ) || status=$?

            cp "$backup" "${dir}/package.json"
            rm -f "$backup"
            return "$status"
          }

          failed=0
          for dir in "${packages[@]}"; do
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            tag="${name}@${version}"
            echo "== ${tag} =="

            if ! publish_package "$dir" "$name" "$version"; then
              echo "::error title=${name}::${tag} 发布失败"
              failed=1
              continue
            fi

            if ! git rev-parse --verify --quiet "refs/tags/${tag}" > /dev/null; then
              if ! git tag -a "$tag" -m "$tag"; then
                echo "::error title=${name}::打 tag 失败 ${tag}"
                failed=1
                continue
              fi
            fi

            if [ -z "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
              if ! git push origin "refs/tags/${tag}"; then
                echo "::error title=${name}::推送 tag 失败 ${tag}"
                failed=1
                continue
              fi
            fi

            if gh release view "$tag" > /dev/null 2>&1; then
              echo "Release ${tag} 已存在，保持不动"
              continue
            fi

            notes=$(mktemp)
            if [ -f "${dir}/CHANGELOG.md" ]; then
              awk -v heading="## ${version}" '
                $0 == heading { inside = 1; next }
                inside && /^## / { exit }
                inside { print }
              ' "${dir}/CHANGELOG.md" > "$notes"
            fi

            if [ -s "$notes" ]; then
              gh release create "$tag" --title "$tag" --verify-tag --notes-file "$notes" \
                || { echo "::error title=${name}::创建 Release 失败 ${tag}"; failed=1; }
            else
              gh release create "$tag" --title "$tag" --verify-tag --generate-notes \
                || { echo "::error title=${name}::创建 Release 失败 ${tag}"; failed=1; }
            fi
            rm -f "$notes"
          done

          exit "$failed"
